basePath: /api
definitions:
  categoryapp.CategoryDto:
    properties:
      categoryId:
        type: integer
      createdAt:
        type: string
      name:
        type: string
      parentId:
        type: integer
      sort:
        type: integer
      updatedAt:
        type: string
    type: object
  categoryapp.CategorySpecDto:
    properties:
      category_id:
        type: integer
      required:
        type: boolean
      sort:
        type: integer
      spec_id:
        type: integer
      spec_name:
        type: string
      values:
        items:
          $ref: '#/definitions/categoryapp.SpecValueDto'
        type: array
    type: object
  categoryapp.SpecValueDto:
    properties:
      name:
        type: string
      sort:
        type: integer
      value_id:
        type: integer
    type: object
  handler.BindSpecReq:
    properties:
      categoryId:
        description: 分类ID
        type: integer
      required:
        description: 是否必填
        type: boolean
      sort:
        description: 排序
        type: integer
      specId:
        description: 规格ID
        type: integer
    required:
    - categoryId
    - specId
    type: object
  handler.CancelOrderRequest:
    properties:
      orderId:
        type: integer
      userId:
        type: integer
    required:
    - orderId
    - userId
    type: object
  handler.CreateInput:
    properties:
      name:
        type: string
      sort:
        type: integer
      values:
        items:
          $ref: '#/definitions/handler.SpecValueInput'
        type: array
    required:
    - name
    type: object
  handler.CreateReq:
    properties:
      name:
        type: string
      parentId:
        type: integer
      sort:
        default: 0
        type: integer
    required:
    - name
    type: object
  handler.OrderListRequest:
    properties:
      page:
        minimum: 1
        type: integer
      pageSize:
        maximum: 100
        minimum: 1
        type: integer
      status:
        description: 可选，若不传则查询所有状态的订单
        enum:
        - 0
        - 1
        - 2
        type: integer
      userId:
        type: integer
    required:
    - userId
    type: object
  handler.SkU:
    properties:
      price:
        description: 价格
        type: integer
      specItems:
        description: SKUCode 不收客户端值，由服务端从规格组合派生，创建后在响应中返回
        items:
          $ref: '#/definitions/handler.specItemReq'
        minItems: 1
        type: array
      stock:
        description: 库存
        minimum: 0
        type: integer
    required:
    - price
    - specItems
    type: object
  handler.SpecValueInput:
    properties:
      name:
        type: string
      sort:
        type: integer
    required:
    - name
    type: object
  handler.UpdateInput:
    properties:
      name:
        type: string
      sort:
        type: integer
      values:
        items:
          $ref: '#/definitions/handler.UpdateValueInput'
        type: array
    required:
    - name
    type: object
  handler.UpdateReq:
    properties:
      name:
        type: string
      parentId:
        type: integer
      sort:
        type: integer
    type: object
  handler.UpdateValueInput:
    properties:
      name:
        type: string
      sort:
        type: integer
      specValueId:
        description: 规格值ID，0 表示新增
        type: integer
    required:
    - name
    type: object
  handler.changeStatusRequest:
    properties:
      status:
        description: |-
          int 而非 domainuser.Status：0 是合法取值（禁用），required 会拒绝 0；
          用 min/max 限定 0~1，swag 也能正确生成 schema
        maximum: 1
        minimum: 0
        type: integer
      userId:
        type: integer
    required:
    - userId
    type: object
  handler.createOrderRequest:
    properties:
      consigneeAddress:
        type: string
      consigneeName:
        type: string
      consigneePhone:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.orderItemRequest'
        minItems: 1
        type: array
    required:
    - consigneeAddress
    - consigneeName
    - consigneePhone
    - items
    type: object
  handler.createProductReq:
    properties:
      categoryId:
        description: 分类ID
        type: integer
      desc:
        description: 商品描述
        type: string
      name:
        description: 商品名称
        type: string
      skus:
        description: 商品规格
        items:
          $ref: '#/definitions/handler.SkU'
        type: array
    required:
    - categoryId
    - name
    - skus
    type: object
  handler.loginRequest:
    properties:
      ip:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.orderItemRequest:
    properties:
      productId:
        type: integer
      quantity:
        minimum: 1
        type: integer
      skuCode:
        type: string
    required:
    - productId
    - quantity
    - skuCode
    type: object
  handler.registerRequest:
    properties:
      password:
        maxLength: 20
        minLength: 6
        type: string
      phone:
        type: string
      username:
        maxLength: 10
        minLength: 2
        type: string
    required:
    - password
    - phone
    - username
    type: object
  handler.specItemReq:
    properties:
      specId:
        description: 规格维度ID
        type: integer
      valueId:
        description: 规格值ID
        type: integer
    required:
    - specId
    - valueId
    type: object
  handler.updateProductReq:
    properties:
      categoryId:
        type: integer
      desc:
        type: string
      name:
        type: string
      productId:
        type: integer
      urls:
        items:
          type: string
        type: array
    required:
    - productId
    type: object
  handler.updateUserRequest:
    properties:
      avatar:
        type: string
      birthday:
        type: string
      email:
        type: string
      gender:
        maximum: 2
        minimum: 0
        type: integer
      nickname:
        maxLength: 10
        minLength: 2
        type: string
      phone:
        type: string
    required:
    - nickname
    type: object
  orderapp.OrderDTO:
    properties:
      cancelledAt:
        description: 取消时间
        type: string
      consigneeAddress:
        description: 收货人地址
        type: string
      consigneeName:
        description: 收货人姓名
        type: string
      consigneePhone:
        description: 收货人手机号
        type: string
      createdAt:
        description: 创建时间
        type: string
      items:
        description: 订单明细
        items:
          $ref: '#/definitions/orderapp.OrderItemDTO'
        type: array
      logisticsNo:
        description: 物流单号
        type: string
      orderId:
        description: 订单ID
        type: integer
      orderNo:
        description: 订单编号
        type: string
      paidAt:
        description: 支付时间
        type: string
      status:
        description: 订单状态：1-待支付，2-已支付，3-已发货，4-已完成，5-已取消
        type: integer
      statusName:
        description: 订单状态名称
        type: string
      totalAmount:
        description: 单位：分
        type: integer
      updatedAt:
        description: 更新时间
        type: string
      userId:
        description: 用户ID
        type: integer
    type: object
  orderapp.OrderItemDTO:
    properties:
      price:
        description: 单位：分
        type: integer
      productId:
        type: integer
      productName:
        type: string
      quantity:
        type: integer
      skuCode:
        type: string
      subtotal:
        description: 小计，单位：分
        type: integer
    type: object
  orderapp.OrderListResult:
    properties:
      list:
        items:
          $ref: '#/definitions/orderapp.OrderDTO'
        type: array
      total:
        type: integer
    type: object
  productapp.ProductDTO:
    properties:
      categoryId:
        type: integer
      createdAt:
        type: string
      desc:
        type: string
      name:
        type: string
      productId:
        type: integer
      skus:
        items:
          $ref: '#/definitions/productapp.SKUDTO'
        type: array
      status:
        type: integer
      updatedAt:
        type: string
    type: object
  productapp.ProductListResult:
    properties:
      list:
        items:
          $ref: '#/definitions/productapp.ProductDTO'
        type: array
      total:
        type: integer
    type: object
  productapp.SKUDTO:
    properties:
      price:
        type: integer
      skuCode:
        type: string
      specDesc:
        description: 展示文案，如 "红色 / L码"
        type: string
      specItems:
        items:
          $ref: '#/definitions/productapp.SpecItemDTO'
        type: array
      stock:
        type: integer
    type: object
  productapp.SpecItemDTO:
    properties:
      specId:
        type: integer
      specName:
        type: string
      valueId:
        type: integer
      valueName:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  specapp.ListDto:
    properties:
      list:
        items:
          $ref: '#/definitions/specapp.SpecDTO'
        type: array
      total:
        type: integer
    type: object
  specapp.SpecDTO:
    properties:
      createdAt:
        type: string
      name:
        description: 规格名称
        type: string
      sort:
        type: integer
      specId:
        type: integer
      updatedAt:
        type: string
      values:
        items:
          $ref: '#/definitions/specapp.SpecValueDTO'
        type: array
    type: object
  specapp.SpecValueDTO:
    properties:
      name:
        type: string
      sort:
        type: integer
      specId:
        type: integer
      specValueId:
        type: integer
    type: object
  user.LoginChannel:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-comments:
      ChannelAlipay: 支付宝快捷登录
      ChannelPassword: 账号密码登录
      ChannelWechat: 微信登录(小程序/公众号/App)
    x-enum-descriptions:
    - 账号密码登录
    - 微信登录(小程序/公众号/App)
    - 支付宝快捷登录
    x-enum-varnames:
    - ChannelPassword
    - ChannelWechat
    - ChannelAlipay
  user.Status:
    enum:
    - 0
    type: integer
    x-enum-varnames:
    - StatusDisabled
  userapp.GetUserListResult:
    properties:
      list:
        items:
          $ref: '#/definitions/userapp.UserDTO'
        type: array
      total:
        type: integer
    type: object
  userapp.LoginResult:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/userapp.UserDTO'
    type: object
  userapp.UserDTO:
    properties:
      alipayUid:
        type: string
      avatar:
        type: string
      birthday:
        type: string
      createdAt:
        type: string
      email:
        type: string
      gender:
        type: integer
      lastLoginAt:
        type: string
      lastLoginIp:
        type: string
      loginChannel:
        $ref: '#/definitions/user.LoginChannel'
      nickname:
        type: string
      openId:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/user.Status'
      unionId:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
host: localhost:9000
info:
  contact: {}
  description: DDD 架构示例服务（用户 / 商品目录 / 订单）。host 为网关端口，经网关按前缀转发到各服务
  title: Demo Service API
  version: "1.0"
paths:
  /category/{id}:
    delete:
      description: 根据分类ID删除分类
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 分类ID格式错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除分类
      tags:
      - 分类
    put:
      consumes:
      - application/json
      description: 根据分类ID更新分类信息，支持部分更新（未传字段不修改）
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      - description: 分类信息（均为可选字段）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/categoryapp.CategoryDto'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新分类
      tags:
      - 分类
  /category/bindSpec:
    post:
      consumes:
      - application/json
      description: 建立分类与规格维度的多对多绑定；重复绑定返回错误
      parameters:
      - description: 绑定信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.BindSpecReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/categoryapp.CategorySpecDto'
              type: object
      summary: 绑定规格到分类
      tags:
      - 分类
  /category/create:
    post:
      consumes:
      - application/json
      description: 创建一个新的商品分类；同名分类已存在时返回错误
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/categoryapp.CategoryDto'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建分类
      tags:
      - 分类
  /category/findAll:
    get:
      description: 返回全部分类列表（不分页）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/categoryapp.CategoryDto'
                  type: array
              type: object
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 查询所有分类
      tags:
      - 分类
  /category/findSpecs/{id}:
    get:
      description: 返回分类下全部绑定的规格维度（含规格值、排序、是否必选）
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/categoryapp.CategorySpecDto'
                  type: array
              type: object
      summary: 查询分类绑定的规格
      tags:
      - 分类
  /category/unbindSpec:
    delete:
      description: 删除分类与规格维度的绑定关系
      parameters:
      - description: 分类ID
        in: query
        name: categoryId
        required: true
        type: integer
      - description: 规格ID
        in: query
        name: specId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 解除规格绑定
      tags:
      - 分类
  /order/cancel:
    post:
      consumes:
      - application/json
      description: 取消订单并回补库存，仅待支付订单可取消，校验订单归属。需要登录（JWT）
      parameters:
      - description: 订单ID与用户ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CancelOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 订单取消成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 订单已取消或当前状态不允许取消
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 失效
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 订单不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 取消订单
      tags:
      - 订单
  /order/create:
    post:
      consumes:
      - application/json
      description: 下单并扣减库存（事务保证），用户ID取自 JWT；同一用户 3 秒内重复提交返回 429。
      parameters:
      - description: 订单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/orderapp.OrderDTO'
              type: object
        "400":
          description: 参数校验失败/商品已下架/库存不足/收货人信息不完整
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 失效
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 商品或 SKU 不存在
          schema:
            $ref: '#/definitions/response.Response'
        "429":
          description: 请求过于频繁（3 秒防重窗口）
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建订单
      tags:
      - 订单
  /order/list:
    post:
      consumes:
      - application/json
      description: 按用户分页查询订单，可按状态过滤：不传或 0 查全部，1-待支付，2-已支付。需要登录（JWT）
      parameters:
      - description: 查询条件
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.OrderListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/orderapp.OrderListResult'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 失效
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 分页查询订单列表
      tags:
      - 订单
  /product/create:
    post:
      consumes:
      - application/json
      description: 创建商品及其 SKU；SKU 编码和规格名称由服务端生成
      parameters:
      - description: 商品信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createProductReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/productapp.ProductDTO'
              type: object
        "400":
          description: 参数校验失败或商品信息无效
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建商品
      tags:
      - 商品
  /product/list:
    post:
      description: 根据分类、商品ID或名称筛选商品并分页返回
      parameters:
      - description: 分类ID
        in: query
        name: categoryId
        type: integer
      - description: 商品ID
        in: query
        name: productId
        type: integer
      - description: 商品名称
        in: query
        name: name
        type: string
      - description: 页码
        in: query
        name: page
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/productapp.ProductListResult'
              type: object
        "400":
          description: 查询参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 分页查询商品
      tags:
      - 商品
  /product/update:
    post:
      consumes:
      - application/json
      description: 根据商品ID更新商品的分类、名称、描述和图片地址
      parameters:
      - description: 商品更新信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateProductReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/productapp.ProductDTO'
              type: object
        "400":
          description: 参数校验失败或商品信息无效
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新商品
      tags:
      - 商品
  /spec/delete/{id}:
    delete:
      description: 根据规格ID删除规格维度
      parameters:
      - description: 规格ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 规格ID格式错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除规格
      tags:
      - 规格
  /spec/findById/{id}:
    get:
      description: 根据规格ID查询规格详情（含规格值列表）
      parameters:
      - description: 规格ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/specapp.SpecDTO'
              type: object
        "400":
          description: 规格ID格式错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 根据ID查询规格
      tags:
      - 规格
  /spec/findByName/{name}:
    get:
      description: 根据规格名称精确查询规格详情（含规格值列表）
      parameters:
      - description: 规格名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/specapp.SpecDTO'
              type: object
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 根据名称查询规格
      tags:
      - 规格
  /spec/list:
    get:
      description: 分页查询规格维度列表，支持按名称模糊搜索；返回列表与总数
      parameters:
      - description: 页码（默认1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认10，最大100）
        in: query
        name: pageSize
        type: integer
      - description: 规格名称（模糊搜索）
        in: query
        name: name
        type: string
      - description: 规格ID
        in: query
        name: specId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/specapp.ListDto'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 分页查询规格列表
      tags:
      - 规格
  /spec/register:
    post:
      consumes:
      - application/json
      description: 创建一个新的规格维度（如颜色、尺寸等），可同时传入规格值列表一次性创建；同名规格已存在时返回错误
      parameters:
      - description: 规格信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/specapp.SpecDTO'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建规格
      tags:
      - 规格
  /spec/update/{id}:
    put:
      consumes:
      - application/json
      description: 根据规格ID更新规格维度及规格值。Values 须传该规格的完整值列表：带ID的值被更新、不带ID的值被新增、库中缺席的值被删除；单事务保证一致
      parameters:
      - description: 规格ID
        in: path
        name: id
        required: true
        type: integer
      - description: 规格信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/specapp.SpecDTO'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 整包更新规格
      tags:
      - 规格
  /user/health:
    get:
      description: 供部署流水线 / 负载均衡探活使用，不校验 JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 健康检查
      tags:
      - 用户
  /user/list:
    get:
      description: 分页查询用户，支持按用户ID精确过滤；需要登录（JWT）
      parameters:
      - description: 页码（从1开始）
        in: query
        name: page
        required: true
        type: integer
      - description: 每页数量（1~100）
        in: query
        name: pageSize
        required: true
        type: integer
      - description: 用户ID（精确匹配）
        in: query
        name: userId
        type: integer
      - description: 用户名
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/userapp.GetUserListResult'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 失效
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 分页查询用户列表
      tags:
      - 用户
  /user/login:
    post:
      consumes:
      - application/json
      description: 登录成功返回 JWT token 与用户信息；用户名或密码错误返回 401（不区分账号是否存在），账号被禁用返回 403
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/userapp.LoginResult'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 账号已被禁用
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户名密码登录
      tags:
      - 用户
  /user/register:
    post:
      consumes:
      - application/json
      description: 用户名密码注册。用户名已存在时返回 400
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/userapp.UserDTO'
              type: object
        "400":
          description: 参数校验失败或用户名已存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 注册用户
      tags:
      - 用户
  /user/status:
    put:
      consumes:
      - application/json
      description: 启用或禁用指定用户。status：0-禁用，1-正常。需要登录（JWT）
      parameters:
      - description: 用户ID与目标状态
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.changeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 失效
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 修改用户状态
      tags:
      - 用户
  /user/user/profile:
    put:
      consumes:
      - application/json
      description: 更新 JWT 对应用户的基础资料，用户ID取自 token。整体替换语义：资料字段以本次提交为准，未提交的可选字段（phone/email/avatar/gender/birthday）会被置空。需要登录（JWT）
      parameters:
      - description: 用户资料
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/userapp.UserDTO'
              type: object
        "400":
          description: 参数校验失败或性别取值不合法
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未登录或 token 失效
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 更新当前用户资料
      tags:
      - 用户
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
