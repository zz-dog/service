basePath: /api
definitions:
  addressapp.AddressDto:
    properties:
      addressId:
        type: integer
      city:
        type: string
      createdAt:
        type: string
      detail:
        type: string
      district:
        type: string
      isDefault:
        type: boolean
      phone:
        type: string
      province:
        type: string
      receiver:
        type: string
      updatedAt:
        type: string
    type: object
  categoryapp.CategoryDto:
    properties:
      categoryId:
        type: integer
      createdAt:
        type: string
      name:
        type: string
      parentId:
        type: integer
      sort:
        type: integer
      updatedAt:
        type: string
    type: object
  categoryapp.CategorySpecDto:
    properties:
      category_id:
        type: integer
      required:
        type: boolean
      sort:
        type: integer
      spec_id:
        type: integer
      spec_name:
        type: string
      values:
        items:
          $ref: '#/definitions/categoryapp.SpecValueDto'
        type: array
    type: object
  categoryapp.SpecValueDto:
    properties:
      name:
        type: string
      sort:
        type: integer
      value_id:
        type: integer
    type: object
  handler.BindSpecReq:
    properties:
      categoryId:
        description: 分类ID
        type: integer
      required:
        description: 是否必填
        type: boolean
      sort:
        description: 排序
        type: integer
      specId:
        description: 规格ID
        type: integer
    required:
    - categoryId
    - specId
    type: object
  handler.CancelOrderRequest:
    properties:
      orderId:
        type: integer
      userId:
        type: integer
    required:
    - orderId
    - userId
    type: object
  handler.CreateInput:
    properties:
      name:
        type: string
      sort:
        type: integer
      values:
        items:
          $ref: '#/definitions/handler.SpecValueInput'
        type: array
    required:
    - name
    type: object
  handler.CreateReq:
    properties:
      name:
        type: string
      parentId:
        type: integer
      sort:
        default: 0
        type: integer
    required:
    - name
    type: object
  handler.SkU:
    properties:
      picture:
        description: 图片
        type: string
      price:
        description: 价格
        type: integer
      specItems:
        description: SKUCode 不收客户端值，由服务端从规格组合派生，创建后在响应中返回
        items:
          $ref: '#/definitions/handler.specItemReq'
        minItems: 1
        type: array
      stock:
        minimum: 0
        type: integer
    required:
    - picture
    - price
    - specItems
    type: object
  handler.SpecValueInput:
    properties:
      name:
        type: string
      sort:
        type: integer
    required:
    - name
    type: object
  handler.UpdateInput:
    properties:
      name:
        type: string
      sort:
        type: integer
      values:
        items:
          $ref: '#/definitions/handler.UpdateValueInput'
        type: array
    required:
    - name
    type: object
  handler.UpdateReq:
    properties:
      name:
        type: string
      parentId:
        type: integer
      sort:
        type: integer
    type: object
  handler.UpdateValueInput:
    properties:
      name:
        type: string
      sort:
        type: integer
      specValueId:
        description: 规格值ID，0 表示新增
        type: integer
    required:
    - name
    type: object
  handler.UploadURLResp:
    properties:
      key:
        type: string
      url:
        type: string
    type: object
  handler.addInventoryReq:
    properties:
      productId:
        description: 商品ID
        type: integer
      qty:
        description: 增加的库存数量
        type: integer
      skuCode:
        description: SKU编码
        type: string
    required:
    - productId
    - qty
    - skuCode
    type: object
  handler.changeStatusRequest:
    properties:
      status:
        description: |-
          int 而非 domainuser.Status：0 是合法取值（禁用），required 会拒绝 0；
          用 min/max 限定 0~1，swag 也能正确生成 schema
        maximum: 1
        minimum: 0
        type: integer
      userId:
        type: integer
    required:
    - userId
    type: object
  handler.createAddressReq:
    properties:
      city:
        maxLength: 32
        type: string
      detail:
        maxLength: 255
        type: string
      district:
        maxLength: 32
        type: string
      isDefault:
        type: boolean
      phone:
        type: string
      province:
        maxLength: 32
        type: string
      receiver:
        maxLength: 32
        type: string
    required:
    - city
    - detail
    - district
    - phone
    - province
    - receiver
    type: object
  handler.createOrderRequest:
    properties:
      consigneeAddress:
        type: string
      consigneeName:
        type: string
      consigneePhone:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.orderItemRequest'
        minItems: 1
        type: array
    required:
    - consigneeAddress
    - consigneeName
    - consigneePhone
    - items
    type: object
  handler.createProductReq:
    properties:
      categoryId:
        description: 分类ID
        type: integer
      desc:
        description: 商品描述
        type: string
      medias:
        description: 商品媒体资源，按顺序展示
        items:
          $ref: '#/definitions/handler.mediaReq'
        type: array
      merchantId:
        description: 管理端语义:代谁铺货;不传/0 = 平台自营。商户端发布不收此字段(服务端推导)
        type: integer
      name:
        description: 商品名称
        type: string
      skus:
        description: 商品规格
        items:
          $ref: '#/definitions/handler.SkU'
        type: array
    required:
    - categoryId
    - name
    - skus
    type: object
  handler.loginRequest:
    properties:
      ip:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.mediaReq:
    properties:
      type:
        description: Type 类型：1图片 2视频 3模型
        enum:
        - 1
        - 2
        - 3
        type: integer
      url:
        type: string
    required:
    - type
    - url
    type: object
  handler.merchantInventoryReq:
    properties:
      qty:
        type: integer
      skuCode:
        type: string
    required:
    - qty
    - skuCode
    type: object
  handler.merchantUpdateProductReq:
    properties:
      categoryId:
        type: integer
      desc:
        type: string
      medias:
        description: 整体替换:不传则清空
        items:
          $ref: '#/definitions/handler.mediaReq'
        type: array
      name:
        type: string
    required:
    - categoryId
    - name
    type: object
  handler.merchantUpdateSKUReq:
    properties:
      picture:
        type: string
      price:
        type: integer
      skuCode:
        type: string
    required:
    - picture
    - price
    - skuCode
    type: object
  handler.mockNotifyRequest:
    properties:
      payNo:
        type: string
    required:
    - payNo
    type: object
  handler.orderItemRequest:
    properties:
      productId:
        type: integer
      quantity:
        minimum: 1
        type: integer
      skuCode:
        type: string
    required:
    - productId
    - quantity
    - skuCode
    type: object
  handler.prepayRequest:
    properties:
      orderNo:
        type: string
    required:
    - orderNo
    type: object
  handler.registerRequest:
    properties:
      password:
        maxLength: 20
        minLength: 6
        type: string
      phone:
        type: string
      username:
        maxLength: 10
        minLength: 2
        type: string
    required:
    - password
    - phone
    - username
    type: object
  handler.reviewApplicationReq:
    properties:
      approve:
        type: boolean
      reason:
        type: string
    required:
    - approve
    type: object
  handler.reviewReq:
    properties:
      approve:
        description: |-
          指针:JSON 不传 approve 和传 false 必须区分开——
          binding:"required" 对 bool 零值会误伤语义正确的 false,指针判 nil 才严谨
        type: boolean
      reason:
        type: string
    required:
    - approve
    type: object
  handler.specItemReq:
    properties:
      specId:
        description: 规格维度ID
        type: integer
      valueId:
        description: 规格值ID
        type: integer
    required:
    - specId
    - valueId
    type: object
  handler.submitApplicationReq:
    properties:
      contactName:
        maxLength: 32
        type: string
      contactPhone:
        maxLength: 16
        type: string
      idCardUrl:
        maxLength: 512
        type: string
      licenseUrl:
        maxLength: 512
        type: string
      shopName:
        maxLength: 64
        type: string
    required:
    - contactName
    - contactPhone
    - idCardUrl
    - licenseUrl
    - shopName
    type: object
  handler.takedownReq:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  handler.updateAddressReq:
    properties:
      city:
        maxLength: 32
        type: string
      detail:
        maxLength: 255
        type: string
      district:
        maxLength: 32
        type: string
      phone:
        type: string
      province:
        maxLength: 32
        type: string
      receiver:
        maxLength: 32
        type: string
    type: object
  handler.updateProductReq:
    properties:
      categoryId:
        type: integer
      desc:
        type: string
      medias:
        description: 整体替换：不传则清空
        items:
          $ref: '#/definitions/handler.mediaReq'
        type: array
      name:
        type: string
      productId:
        type: integer
    required:
    - productId
    type: object
  handler.updateSKUReq:
    properties:
      picture:
        description: 商品图片
        type: string
      price:
        description: 单价(分)
        type: integer
      productId:
        description: 商品ID
        type: integer
      skuCode:
        description: SKU编码
        type: string
    required:
    - picture
    - price
    - productId
    - skuCode
    type: object
  handler.updateShopReq:
    properties:
      desc:
        maxLength: 512
        type: string
      logo:
        maxLength: 512
        type: string
      name:
        maxLength: 64
        type: string
    required:
    - name
    type: object
  handler.updateUserRequest:
    properties:
      avatar:
        type: string
      birthday:
        type: string
      email:
        type: string
      gender:
        maximum: 2
        minimum: 0
        type: integer
      nickname:
        maxLength: 10
        minLength: 2
        type: string
      phone:
        type: string
    required:
    - nickname
    type: object
  imapp.ConversationDTO:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      lastMsgAt:
        type: string
      lastMsgContent:
        type: string
      merchantId:
        type: integer
      peerId:
        description: 对端身份:买家视角=merchantId,卖家视角=userId
        type: integer
      unread:
        description: 我这一侧的未读数
        type: integer
      userId:
        description: 买家侧身份
        type: integer
    type: object
  imapp.MessageDTO:
    properties:
      content:
        type: string
      contentType:
        type: integer
      conversationId:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      senderId:
        type: integer
      senderSide:
        type: integer
    type: object
  merchantapp.ApplicationDTO:
    properties:
      contactName:
        type: string
      contactPhone:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      idCardUrl:
        type: string
      licenseUrl:
        type: string
      merchantId:
        type: integer
      rejectReason:
        type: string
      reviewedAt:
        type: string
      shopName:
        type: string
      status:
        type: integer
      userId:
        type: integer
    type: object
  merchantapp.MerchantDTO:
    properties:
      createdAt:
        type: string
      desc:
        type: string
      logo:
        type: string
      merchantId:
        type: integer
      name:
        type: string
      status:
        type: integer
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  orderapp.OrderDTO:
    properties:
      cancelledAt:
        description: 取消时间
        type: string
      consigneeAddress:
        description: 收货人地址
        type: string
      consigneeName:
        description: 收货人姓名
        type: string
      consigneePhone:
        description: 收货人手机号
        type: string
      createdAt:
        description: 创建时间
        type: string
      items:
        description: 订单明细
        items:
          $ref: '#/definitions/orderapp.OrderItemDTO'
        type: array
      logisticsNo:
        description: 物流单号
        type: string
      orderId:
        description: 订单ID
        type: integer
      orderNo:
        description: 订单编号
        type: string
      paidAt:
        description: 支付时间
        type: string
      status:
        description: 订单状态：1-待支付，2-已支付，3-已发货，4-已完成，5-已取消
        type: integer
      statusName:
        description: 订单状态名称
        type: string
      totalAmount:
        description: 单位：分
        type: integer
      updatedAt:
        description: 更新时间
        type: string
      userId:
        description: 用户ID
        type: integer
    type: object
  orderapp.OrderItemDTO:
    properties:
      merchantId:
        description: 商家ID
        type: integer
      price:
        description: 单位：分
        type: integer
      productId:
        type: integer
      productName:
        type: string
      quantity:
        type: integer
      skuCode:
        type: string
      subtotal:
        description: 小计，单位：分
        type: integer
    type: object
  orderapp.OrderListResult:
    properties:
      list:
        items:
          $ref: '#/definitions/orderapp.OrderDTO'
        type: array
      total:
        type: integer
    type: object
  paymentapp.PrepayDto:
    properties:
      amount:
        type: integer
      channel:
        description: domainpayment.Channel 数值(mock=2 / alipay=1),swagger 可解析
        type: integer
      createdAt:
        type: string
      orderNo:
        type: string
      paidAt:
        type: string
      payNo:
        type: string
      payUrl:
        type: string
      status:
        description: domainpayment.PaymentStatus 数值
        type: integer
      userId:
        type: integer
    type: object
  productapp.MediaDTO:
    properties:
      type:
        description: 类型 1图片 2视频 3模型
        type: integer
      url:
        description: 资源地址
        type: string
    type: object
  productapp.ProductDTO:
    properties:
      categoryId:
        type: integer
      createdAt:
        type: string
      desc:
        type: string
      medias:
        items:
          $ref: '#/definitions/productapp.MediaDTO'
        type: array
      merchantId:
        description: 归属商户;0 = 平台自营
        type: integer
      name:
        type: string
      productId:
        type: integer
      rejectReason:
        description: 平台否决理由;商户在"我的商品"里看
        type: string
      skus:
        items:
          $ref: '#/definitions/productapp.SKUDTO'
        type: array
      status:
        description: 1上架 2下架 3待审核 4已驳回 5违规下架
        type: integer
      updatedAt:
        type: string
    type: object
  productapp.ProductListResult:
    properties:
      list:
        items:
          $ref: '#/definitions/productapp.ProductDTO'
        type: array
      total:
        type: integer
    type: object
  productapp.SKUDTO:
    properties:
      price:
        type: integer
      skuCode:
        type: string
      specDesc:
        description: 展示文案，如 "红色 / L码"
        type: string
      specItems:
        items:
          $ref: '#/definitions/productapp.SpecItemDTO'
        type: array
      stock:
        type: integer
    type: object
  productapp.SpecItemDTO:
    properties:
      specId:
        type: integer
      specName:
        type: string
      valueId:
        type: integer
      valueName:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  settlementapp.SettlementDetailDto:
    properties:
      amount:
        type: integer
      merchantId:
        type: integer
    type: object
  settlementapp.SettlementDto:
    properties:
      commissionAmount:
        type: integer
      createdAt:
        type: string
      details:
        items:
          $ref: '#/definitions/settlementapp.SettlementDetailDto'
        type: array
      failReason:
        type: string
      orderNo:
        type: string
      payNo:
        type: string
      rateBps:
        type: integer
      retryCount:
        type: integer
      settleAmount:
        type: integer
      settleNo:
        type: string
      settledAt:
        type: string
      status:
        type: integer
      statusName:
        type: string
      totalAmount:
        type: integer
    type: object
  settlementapp.SettlementListDto:
    properties:
      list:
        items:
          $ref: '#/definitions/settlementapp.SettlementDto'
        type: array
      total:
        type: integer
    type: object
  specapp.ListDto:
    properties:
      list:
        items:
          $ref: '#/definitions/specapp.SpecDTO'
        type: array
      total:
        type: integer
    type: object
  specapp.SpecDTO:
    properties:
      createdAt:
        type: string
      name:
        description: 规格名称
        type: string
      sort:
        type: integer
      specId:
        type: integer
      updatedAt:
        type: string
      values:
        items:
          $ref: '#/definitions/specapp.SpecValueDTO'
        type: array
    type: object
  specapp.SpecValueDTO:
    properties:
      name:
        type: string
      sort:
        type: integer
      specId:
        type: integer
      specValueId:
        type: integer
    type: object
  user.LoginChannel:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-comments:
      ChannelAlipay: 支付宝快捷登录
      ChannelPassword: 账号密码登录
      ChannelWechat: 微信登录(小程序/公众号/App)
    x-enum-descriptions:
    - 账号密码登录
    - 微信登录(小程序/公众号/App)
    - 支付宝快捷登录
    x-enum-varnames:
    - ChannelPassword
    - ChannelWechat
    - ChannelAlipay
  user.Status:
    enum:
    - 0
    type: integer
    x-enum-varnames:
    - StatusDisabled
  userapp.GetUserListResult:
    properties:
      list:
        items:
          $ref: '#/definitions/userapp.UserDTO'
        type: array
      total:
        type: integer
    type: object
  userapp.LoginResult:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/userapp.UserDTO'
    type: object
  userapp.UserDTO:
    properties:
      alipayUid:
        type: string
      avatar:
        type: string
      birthday:
        type: string
      createdAt:
        type: string
      email:
        type: string
      gender:
        type: integer
      lastLoginAt:
        type: string
      lastLoginIp:
        type: string
      loginChannel:
        $ref: '#/definitions/user.LoginChannel'
      nickname:
        type: string
      openId:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/user.Status'
      unionId:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
host: localhost:9000
info:
  contact: {}
  description: DDD 架构示例服务（用户 / 商品目录 / 订单）。host 为网关端口，经网关按前缀转发到各服务
  title: Demo Service API
  version: "1.0"
paths:
  /catalog/admin/category/{id}:
    delete:
      description: 根据分类ID删除分类
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 分类ID格式错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除分类
      tags:
      - 管理端-分类
    put:
      consumes:
      - application/json
      description: 根据分类ID更新分类信息，支持部分更新（未传字段不修改）
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      - description: 分类信息（均为可选字段）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/categoryapp.CategoryDto'
              type: object
        "400":
          description: 参数校验失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新分类
      tags:
      - 管理端-分类
  /catalog/admin/category/bindSpec:
    post:
      consumes:
      - application/json
      description: 建立分类与规格维度的多对多绑定；重复绑定返回错误
      parameters:
      - description: 绑定信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.BindSpecReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/categoryapp.CategorySpecDto'
              type: object
      summary: 绑定规格到分类
      tags:
      - 管理端-分类
  /catalog/admin/category/create:
    post:
      consumes:
      - application/json
      description: 创建一个新的商品分类；同名分类已存在时返回错误
      parameters:
      - description: 分类信息
        in: body
        name: request
