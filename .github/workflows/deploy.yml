name: Deploy Go Backend
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 配置ssh连接你的服务器（和前端一样使用 Secrets 存放私钥）
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/backend
            git pull --ff-only origin main
            test -f config/config.yaml
            # 构建镜像
            podman build -t backend:latest .
            # 停止旧容器（不存在不会报错 || true）
            podman rm -f backend || true
            # 启动新容器
            podman run -d --name backend \
              -p 0.0.0.0:8090:8090 \
              -v "$PWD/config:/app/config:ro" \
              --restart=always \
              backend:latest
            for attempt in $(seq 1 10); do
              if curl --fail --silent http://127.0.0.1:8090/api/health > /dev/null; then
                echo "health check passed"
                exit 0
              fi
              sleep 3
            done
            podman logs backend
            exit 1
