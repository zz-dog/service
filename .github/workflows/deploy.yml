name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发重发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 服务器上要求：/home/admin/demo 是本仓库的 git clone，生产配置在 /home/admin/demo-config
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/demo
            git pull --ff-only origin main

            # 镜像由 compose 构建一次（4 个服务共用同一镜像，见 Containerfile）
            docker compose build

            # 只拉起应用服务，不动正在运行的 mysql/nacos/redis/nginx
            docker compose up -d gateway identity catalog order

            sleep 5
            for svc in gateway identity catalog order; do
              if [ -z "$(docker ps -q --filter "name=^${svc}$" --filter "status=running")" ]; then
                echo "❌ $svc 未正常运行，最近日志："
                docker logs --tail 50 "$svc"
                exit 1
              fi
            done
            echo "✅ 4 个服务已部署并运行"
