name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 服务列表与 cmd/ 目录一一对应
  SERVICES: gateway identity catalog order

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test
        run: go test -v ./...

      # 与 Containerfile 相同的编译方式，提前验证 4 个服务都能编译通过
      - name: Build (linux/amd64)
        run: |
          for svc in $SERVICES; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" -o bin/$svc ./cmd/$svc
          done

      - name: Check binaries
        run: |
          for svc in $SERVICES; do
            test -s bin/$svc || { echo "缺少二进制：$svc"; exit 1; }
          done
          echo "binaries OK"
